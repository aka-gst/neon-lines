  <style>.home-menu{position:absolute;right:14px;top:14px;z-index:20}.home-menu summary{width:31px;height:31px;display:grid;place-items:center;border:1px solid #313442;background:#0b0c12ef;color:#d5cadb;cursor:pointer;list-style:none}.home-menu summary::-webkit-details-marker{display:none}.home-menu a{display:block;margin-top:4px;padding:8px 10px;background:#0b0c12f5;border:1px solid #313442;color:#d5cadb;font:9px ui-monospace,monospace;letter-spacing:.06em;text-decoration:none;white-space:nowrap}@media(min-width:681px){.play-area{order:1}.sidebar{order:2}}@media(max-width:680px){.game{padding:7px}.brand{top:10px;left:10px;font-size:29px}.stage{height:100%;display:grid;grid-template-rows:auto auto auto;align-content:center;grid-template-columns:1fr;gap:6px;padding-top:36px}.sidebar{display:contents}.sidebar-top{grid-row:1;display:flex;gap:6px;align-items:stretch}.sidebar-bottom{grid-row:3;display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}.sidebar .meter,.sidebar .preview,.sidebar .records{padding:5px;min-width:0;flex:1}.sidebar .meter strong{font-size:13px}.sidebar small{font-size:7px}.preview>div{gap:3px}.preview .ball{width:13px}.play-area{grid-row:2;display:grid;grid-template-rows:minmax(0,1fr) 12px;min-height:0}.board{width:min(calc(100vw - 14px),calc(100dvh - 180px));height:auto;max-height:100%;justify-self:center;align-self:center}.message{margin:2px 0 0;font-size:7px}.action{padding:7px 4px;font-size:7px}.records{display:none}.home-menu{right:9px;top:9px}}</style>
  <style>@media(min-width:681px){.sidebar-top,.sidebar-bottom{display:grid;gap:11px}}@media(max-height:600px) and (orientation:landscape){.game{padding:6px}.brand{display:none}.home-menu{top:7px;right:7px}.stage{padding:0;grid-template:1fr/minmax(0,auto) 150px;gap:8px;justify-content:center}.play-area{grid-row:auto;display:grid;grid-template-rows:minmax(0,1fr) 12px}.board{width:auto;height:calc(100dvh - 18px);max-width:calc(100vw - 172px);justify-self:center}.message{margin:1px 0 0;font-size:7px}.sidebar{display:grid;gap:5px}.sidebar-top,.sidebar-bottom{display:grid;gap:5px}.sidebar .meter,.sidebar .preview,.sidebar .records{padding:5px}.sidebar .meter strong{font-size:18px}.sidebar small{font-size:7px}.action{min-height:32px;padding:5px;font-size:8px}.records p{margin:2px 0}}</style>
  <style>@media(max-width:1180px) and (max-height:820px) and (orientation:landscape){.game{padding:7px}.brand{display:none}.stage{padding:0;grid-template:1fr/minmax(0,auto) clamp(170px,24vw,240px);gap:9px;justify-content:center}.play-area{grid-row:auto;display:grid;grid-template-rows:minmax(0,1fr) auto}.board{width:auto;height:min(calc(100dvh - 50px),calc(100vw - 270px));max-width:none;justify-self:center}.message{min-height:34px;margin:3px 0 0;padding:5px 7px;font-size:9px}.sidebar{display:grid;gap:6px}.sidebar-top,.sidebar-bottom{display:grid;gap:6px}.sidebar .meter,.sidebar .preview,.sidebar .records{padding:6px}.sidebar .meter strong{font-size:18px}.sidebar small{font-size:8px}.action{min-height:38px;padding:6px;font-size:9px}.records{display:block;max-height:100px;overflow:auto}.records p{margin:3px 0}}</style>
  <style>@media(max-width:680px){.sidebar .meter,.sidebar .preview{padding:8px 7px}.sidebar .meter strong{font-size:19px;line-height:1}.sidebar small{margin-bottom:4px;font-size:8px}.preview .ball{width:17px}.sidebar-bottom{position:relative;z-index:4;grid-template-columns:1fr 1fr;gap:7px;padding:6px;background:linear-gradient(180deg,#101119f2,#05050a)}.sidebar-bottom .records{display:block;grid-column:1/-1;max-height:54px;overflow:auto;padding:6px 8px;background:#0b0c12ee}.records p{margin:3px 0;font-size:8px}.records em{font-size:8px}.action{min-height:43px;padding:9px 7px;font-size:10px;letter-spacing:.05em}.message{min-height:14px;color:#fff4ff;text-shadow:0 1px #000;font-size:9px}.board{width:min(calc(100vw - 14px),calc(100dvh - 250px))}}</style>
  <style>@media(min-width:681px){.stage{grid-template-columns:minmax(0,auto) 185px}.meter strong{font-size:30px;line-height:1}.meter{padding:14px 12px}.sidebar small{font-size:10px}}</style>
  <style>
    @media(max-width:680px){
      .play-area{grid-template-rows:minmax(0,1fr) auto;overflow:visible}
      .message{position:relative;z-index:7;height:auto;min-height:28px;margin:4px 0 0;padding:6px 8px;display:flex;align-items:center;background:#0b0c12;color:#d5cadb;font-size:10px;line-height:1.35;box-shadow:inset 0 1px #313442}
      .sidebar-bottom{margin-top:2px}
    }
    @media(min-width:1800px) and (min-height:850px){
      .game{padding:clamp(24px,1.8vw,44px)}
      .brand{left:clamp(32px,2.2vw,58px);top:clamp(30px,2vw,52px);font-size:clamp(76px,5vw,118px)}
      .brand small{margin-top:28px;font-size:15px}
      .stage{grid-template-columns:minmax(0,auto) clamp(240px,14vw,340px);gap:clamp(36px,3.5vw,76px)}
      .board{width:min(82dvh,calc(100vw - 500px));max-width:980px}
      .sidebar,.sidebar-top,.sidebar-bottom{gap:18px}
      .meter,.preview,.records{padding:clamp(16px,1.2vw,26px)}
      .sidebar small{font-size:clamp(13px,.72vw,17px)}
      .meter strong{font-size:clamp(40px,2.5vw,58px)}
      .preview .ball{width:clamp(28px,1.6vw,40px)}
      .action{min-height:58px;font-size:clamp(13px,.8vw,18px)}
      .records p,.records em{font-size:clamp(12px,.7vw,16px)}
      .message{height:auto;min-height:42px;font-size:clamp(14px,.8vw,18px)}
    }
  </style>
</head>
<body>
  <main class="game">
    <a class="game-home-menu" href="/">НА ГЛАВНУЮ</a>
    <header class="brand"><span>НЕОН</span><b>ЛИНИИ</b><small>РЕТРО-ГОЛОВОЛОМКА · 9×9</small></header>
    <section class="stage">
      <div class="play-area">
        <div id="board" class="board" aria-label="Игровое поле"></div>
        <p id="message" class="message">Нажми «Начать».</p>
      </div>
      <aside class="sidebar">
        <div class="sidebar-top"><div class="meter"><small>СЧЁТ</small><strong id="score">0</strong><em id="stage">этап 1</em></div><div class="meter"><small>ЛУЧШИЙ</small><strong id="best">0</strong></div><div class="preview"><small>СЛЕДУЮЩИЕ</small><div id="next"></div></div></div>
        <div class="sidebar-bottom"><button id="restart" class="action">НОВАЯ ИГРА</button><button id="sound-toggle" class="action">ЗВУК: ВКЛ</button><button id="undo" class="action">↶ ОТКАТ 5 · −50</button><button id="how" class="action">? КАК ИГРАТЬ</button><div class="records"><small>РЕКОРДЫ</small><div id="records"></div></div></div>
      </aside>
    </section>
  </main>
  <script src="game.js?v=20"></script>
</body>
</html>
